const CFG_OK=/^https:\/\/.+\.supabase\.co\/?$/.test(SUPABASE_URL.trim())&&(SUPABASE_KEY.startsWith('sb_publishable_')||SUPABASE_KEY.length>40);

const subs=new Set();const poke=()=>subs.forEach(f=>f());
function mkQ(col){const q={o:null,l:null,doc,orderBy(f,d='asc'){q.o=[f,d];return q},limit(n){q.l=n;return q},
 async fetch(){let r;if(col=='roles'){r=await sb.from('roles').select('*');return(r.data||[]).map(x=>({id:x.uid,data:()=>({role:x.role,suspended:x.suspended,name:x.name,since:x.since||x.created_at})}))}
  r=await sb.from('docs').select('id,data').eq('col',col);let l=(r.data||[]).map(x=>({id:x.id,data:()=>x.data}));
  if(q.o)l.sort((a,b)=>((a.data()[q.o[0]]>b.data()[q.o[0]])?1:-1)*(q.o[1]=='desc'?-1:1));if(q.l)l=l.slice(0,q.l);return l},
 onSnapshot(fn,err){let last='',on=true;const run=async()=>{if(!on)return;try{const docs=await q.fetch(),k=JSON.stringify(docs.map(d=>[d.id,d.data()]));if(k!=last){last=k;try{fn({docs})}catch(x){console.error('['+col+']',x);showErr(x)}}}catch(e){console.error('['+col+'] fetch',e);err&&err(e)}};run();subs.add(run);const t=setInterval(run,5000);return()=>{on=false;subs.delete(run);clearInterval(t)}}};
 function doc(id){const e=m=>{if(m.error)throw m.error;poke()};return{
  async get(){if(col=='roles'){const r=await sb.from('roles').select('*').eq('uid',id).maybeSingle();return{exists:!!r.data,data:()=>r.data}}const r=await sb.from('docs').select('data').eq('col',col).eq('id',id).maybeSingle();return{exists:!!r.data,data:()=>r.data?.data}},
  async set(d){let r=await sb.from('docs').update({data:d}).eq('col',col).eq('id',id).select('id');if(r.error)throw r.error;if(r.data&&r.data.length)return poke();r=await sb.from('docs').insert({col,id,data:d});if(r.error&&(r.error.code=='23505'||/duplicate|unique/i.test(r.error.message||'')))throw new Error('sem permissão para alterar este registro (confira as políticas RLS da tabela docs no Supabase)');e(r)},
  async update(d){if(col=='roles')return e(await sb.from('roles').update(d).eq('uid',id));const r=await sb.from('docs').select('data').eq('col',col).eq('id',id).maybeSingle();if(r.error)throw r.error;if(!r.data)throw new Error('registro não encontrado');const u=await sb.from('docs').update({data:{...r.data.data,...d}}).eq('col',col).eq('id',id).select('id');if(!u.error&&u.data&&!u.data.length)throw new Error('sem permissão para alterar este registro');e(u)},

 return q}

function recPick(sh,n){if(!A.length)return[];const ok=new Set(A.map(a=>a.id)),cur=(mem.rec||[]).filter(id=>ok.has(id));if(mem.rec&&cur.length>=Math.min(n,A.length))return cur.map(id=>A.find(a=>a.id==id));
 const prev=new Set(mem.recPrev||[]),key=a=>Math.pow(Math.random(),1/(prev.has(a.id)?.3:1)),pick=A.map(a=>[key(a),a]).sort((x,y)=>y[0]-x[0]).slice(0,n).map(x=>x[1]);mem.rec=pick.map(a=>a.id);return pick}
const recNew=()=>{mem.recPrev=mem.rec;mem.rec=null;draw(1)};

/* ===== v12: permissões de anime (editar = dono/ADM; excluir = só ADM; pedido de exclusão) ===== */
const canDel=a=>isAdm();
async function delA(id){const a=A.find(x=>x.id==id);if(!a)return false;if(!canDel(a)){toast('Somente administradores podem excluir animes. Use "Solicitar exclusão".','er');return false}if(!(await ask('Excluir “'+esc(a.name)+'”?','Excluir','Essa ação não pode ser desfeita.')))return false;
 try{await db.collection('animes').doc(id).delete()}catch(e){toast('Não foi possível excluir: '+(e.message||'sem permissão'),'er');return false}log('del-anime',id);toast('Anime excluído');if(view[0]=='det')go('cat');else draw(1);return true}
function reqDel(id){const a=A.find(x=>x.id==id);if(!a||!uid||susp||a.owner!=uid||isAdm())return;modal(`<h3>🗑 Solicitar exclusão</h3><p class="mu">Somente administradores podem excluir animes. Envie o pedido para “${esc(a.name)}” e a administração vai analisar.</p><textarea id="rw_t" rows="3" maxlength="300" placeholder="Motivo (opcional)"></textarea><div class="row end"><button onclick="closeM()">Cancelar</button><button class="cta" onclick="sendDel('${id}')">Enviar pedido</button></div>`)}
async function sendDel(id){const t=($('#rw_t')||{value:''}).value.trim(),a=A.find(x=>x.id==id);closeM();if(!a||a.owner!=uid)return;const rid='r_delreq_'+id+'_'+uid;
 try{const ex=await db.collection('reports').doc(rid).get();if(ex&&ex.exists)return toast('Você já enviou um pedido de exclusão para este anime.','er')}catch(e){}
 await db.collection('reports').doc(rid).set({kind:'anime',tid:id,req:'delete',reason:'Solicitação de exclusão',detail:t,why:'Solicitação de exclusão'+(t?': '+t:''),by:uid,author:uid,ts:Date.now(),open:true});log('request-delete',id);toast('Pedido enviado à administração.')}
async function delReqDo(rid,tid){if(await delA(tid))closeR(rid,'Atendida')}
